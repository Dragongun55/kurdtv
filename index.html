<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Kurdistan Live Hub</title>

    <!-- hls.js plays .m3u8 live streams in browsers that can't do it natively (Chrome, Firefox, Edge) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

    <!-- Fonts: Outfit for the interface, Fraunces for the radio station title -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Fraunces:wght@700&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           1. THEME COLOURS
           Change these to re-colour the whole app.
           ========================================================= */
        :root {
            --bg:      #070810;   /* page background            */
            --bg2:     #0c0e1a;   /* sidebar                    */
            --bg3:     #111422;   /* hover / tab background     */
            --bg4:     #181c2e;   /* logo boxes                 */
            --surface: #1d2138;   /* active tab, slider track   */
            --border:  rgba(255,255,255,0.06);
            --border2: rgba(255,255,255,0.11);
            --text:    #e8eaf6;
            --muted:   #4b5070;
            --red:     #f87171;   /* "LIVE" indicator           */

            --tv:      #60a5fa;   /* TV accent (blue)           */
            --tv-dim:  rgba(96,165,250,0.07);
            --radio:   #fb923c;   /* Radio accent (orange)      */
            --radio-dim: rgba(251,146,60,0.07);

            /* The current accent. Switches to orange in radio mode (see section 7). */
            --accent:     var(--tv);
            --accent-dim: var(--tv-dim);
        }

        /* =========================================================
           2. RESET & PAGE LAYOUT
           Desktop: sidebar on the left, player on the right.
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            display: flex;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        body.radio-mode {
            --accent: var(--radio);
            --accent-dim: var(--radio-dim);
        }

        /* =========================================================
           3. SIDEBAR
           ========================================================= */
        .sidebar {
            width: 272px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg2);
            border-right: 1px solid var(--border);
        }

        /* --- Brand (logo + name) --- */
        .brand {
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: 1.35rem;
            border-bottom: 1px solid var(--border);
        }
        .brand-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            color: #fff;
        }
        .brand-icon svg { width: 16px; height: 16px; }
        .brand-name { font-weight: 800; font-size: .92rem; }
        .brand-tag  { font-size: .62rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

        /* --- TV / Radio tab switch --- */
        .tabs {
            position: relative;
            display: flex;
            margin: .9rem;
            padding: 3px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        /* The sliding highlight behind the active tab */
        .tab-pill {
            position: absolute;
            top: 3px; left: 3px;
            width: calc(50% - 3px);
            height: calc(100% - 6px);
            background: var(--surface);
            border-radius: 8px;
            transition: transform .28s cubic-bezier(.34,1.56,.64,1);
        }
        body.radio-mode .tab-pill { transform: translateX(100%); }

        .tab-btn {
            position: relative;           /* sits above the pill */
            flex: 1;
            display: flex; align-items: center; justify-content: center; gap: .4rem;
            padding: .52rem;
            border: none;
            background: none;
            cursor: pointer;
            font: 700 .76rem 'Outfit', sans-serif;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--muted);
            transition: color .2s;
        }
        .tab-btn svg { width: 13px; height: 13px; }
        .tab-btn.active { color: var(--accent); }

        /* --- Channel / station list --- */
        .list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            list-style: none;
            padding: .4rem .65rem 1rem;
        }
        .list::-webkit-scrollbar { width: 2px; height: 2px; }
        .list::-webkit-scrollbar-thumb { background: var(--border2); }

        .item {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .6rem .7rem;
            margin-bottom: 1px;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: background .14s, transform .1s;
        }
        .item:hover    { background: var(--bg3); transform: translateX(3px); }
        .item.selected { background: var(--accent-dim); border-color: var(--accent); }

        .item-name { font-weight: 600; font-size: .845rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub  { font-size: .65rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
        .item-live { color: var(--red); font-weight: 700; }

        /* --- Logo box (used in list + top bar). Shows image, or initials if image is missing --- */
        .logo {
            width: 40px; height: 40px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            background: var(--bg4);
            border: 1px solid var(--border2);
            border-radius: 8px;
        }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .initials { font-size: .65rem; font-weight: 800; color: var(--accent); }

        /* --- Blinking red dot --- */
        .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--red);
            animation: blink 1.6s ease-in-out infinite;
        }
        @keyframes blink { 50% { opacity: .25; } }

        /* =========================================================
           4. MAIN AREA (top bar + stage)
           ========================================================= */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* Soft coloured glow in the background, follows the accent colour */
        .main::before {
            content: '';
            position: absolute;
            top: -100px; right: 50px;
            width: 500px; height: 350px;
            background: radial-gradient(circle, var(--accent-dim), transparent 70%);
            filter: blur(60px);
            pointer-events: none;
        }

        .topbar {
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: .9rem;
            padding: 0 1.4rem;
            border-bottom: 1px solid var(--border);
            background: rgba(7,8,16,.55);
            backdrop-filter: blur(16px);
            position: relative;
        }
        .topbar .logo { width: 26px; height: 26px; border-radius: 6px; }
        .topbar-name  { font-weight: 700; font-size: .88rem; }

        /* "LIVE" (TV) / "ON AIR" (radio) badge */
        .badge {
            display: flex; align-items: center; gap: 5px;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: .62rem; font-weight: 700;
            letter-spacing: .06em; text-transform: uppercase;
            color: var(--red);
            background: rgba(248,113,113,.08);
            border: 1px solid rgba(248,113,113,.18);
        }
        body.radio-mode .badge {
            color: var(--radio);
            background: var(--radio-dim);
            border-color: rgba(251,146,60,.2);
        }
        body.radio-mode .badge .dot { background: var(--radio); }

        .stage {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 2rem;
            position: relative;
        }

        /* =========================================================
           5. TV PLAYER
           ========================================================= */
        .tv {
            position: relative;
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            border-radius: 16px;
            box-shadow: 0 0 0 1px var(--border2), 0 32px 72px rgba(0,0,0,.65);
        }
        /* Video or iframe fills the whole player */
        .tv video, .tv iframe {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            border: none;
            object-fit: contain;
        }

        /* Loading spinner shown over the player until the stream starts */
        .loader {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
            background: rgba(7,8,16,.75);
            font-size: .72rem; color: var(--muted);
            transition: opacity .4s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border2);
            border-top-color: var(--tv);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* =========================================================
           6. RADIO PLAYER (logo orb + controls)
           ========================================================= */
        .radio {
            display: none;               /* shown only in radio mode */
            flex-direction: column;
            align-items: center;
            gap: 2.2rem;
            text-align: center;
        }

        /* Orb with expanding rings while playing */
        .orb-scene { position: relative; display: flex; align-items: center; justify-content: center; }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(251,146,60,.12);
            opacity: 0;
        }
        .ring:nth-child(1) { width: 190px; height: 190px; }
        .ring:nth-child(2) { width: 255px; height: 255px; }
        .ring:nth-child(3) { width: 320px; height: 320px; }
        /* Rings only animate while audio is playing, each one starting a bit later */
        .playing .ring { animation: ring 3s ease-out infinite; }
        .playing .ring:nth-child(2) { animation-delay: .85s; }
        .playing .ring:nth-child(3) { animation-delay: 1.7s; }
        @keyframes ring {
            0%   { transform: scale(.88); opacity: .55; }
            100% { transform: scale(1.04); opacity: 0; }
        }

        .orb {
            width: 155px; height: 155px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg3);
            border: 1px solid var(--border2);
            transition: box-shadow .35s;
        }
        .playing .orb { box-shadow: 0 0 70px rgba(251,146,60,.22), 0 0 0 1px rgba(251,146,60,.28); }
        .orb .logo { width: 88px; height: 88px; border-radius: 50%; border: none; }
        .orb .initials { font-size: 1.35rem; }

        .station-name  { font-family: 'Fraunces', serif; font-size: 1.9rem; font-weight: 700; }
        .station-genre { font-size: .78rem; color: var(--muted); margin-top: .35rem; letter-spacing: .06em; text-transform: uppercase; }

        .controls { display: flex; align-items: center; gap: 1.1rem; color: var(--muted); }
        .controls > svg { width: 15px; height: 15px; }

        /* Volume slider */
        .volume {
            -webkit-appearance: none;
            appearance: none;
            width: 88px; height: 3px;
            background: var(--surface);
            border-radius: 3px;
            cursor: pointer;
        }
        .volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: var(--radio);
        }

        /* Play / pause button */
        .play-btn {
            width: 56px; height: 56px;
            border: none;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--radio);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(251,146,60,.35);
            transition: transform .18s;
        }
        .play-btn:hover  { transform: scale(1.08); }
        .play-btn:active { transform: scale(.96); }
        .play-btn svg    { width: 21px; height: 21px; }

        /* =========================================================
           7. MODE SWITCHING
           <body class="radio-mode"> hides the TV and shows the radio.
           ========================================================= */
        body.radio-mode .tv    { display: none; }
        body.radio-mode .radio { display: flex; }

        /* =========================================================
           8. MOBILE (screens 768px wide or less)
           Sidebar becomes a top bar with a horizontal channel strip.
           ========================================================= */
        @media (max-width: 768px) {
            body { flex-direction: column; }

            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .brand   { display: none; }
            .tabs    { margin: .6rem .6rem .4rem; }

            /* Horizontal scrolling list of small cards */
            .list {
                flex: none;
                display: flex;
                gap: 6px;
                overflow-x: auto;
                overflow-y: hidden;
                padding: .3rem .6rem .6rem;
                scroll-snap-type: x mandatory;
            }
            .item {
                flex-direction: column;
                gap: .3rem;
                min-width: 68px; max-width: 68px;
                padding: .5rem .3rem;
                border-radius: 12px;
                text-align: center;
                scroll-snap-align: start;
            }
            .item:hover { transform: none; }
            .item .logo { width: 34px; height: 34px; }
            .item-name  { font-size: .58rem; font-weight: 700; white-space: normal; line-height: 1.2; }
            .item-sub   { display: none; }

            .main::before { display: none; }
            .topbar       { height: 42px; padding: 0 .9rem; gap: .6rem; }
            .topbar-name  { font-size: .78rem; }
            .stage        { padding: .7rem; }
            .tv           { border-radius: 10px; }

            /* Smaller radio orb */
            .radio { gap: 1.4rem; }
            .orb   { width: 120px; height: 120px; }
            .orb .logo { width: 68px; height: 68px; }
            .ring:nth-child(1) { width: 148px; height: 148px; }
            .ring:nth-child(2) { width: 198px; height: 198px; }
            .ring:nth-child(3) { width: 248px; height: 248px; }
            .station-name { font-size: 1.45rem; }
            .volume       { width: 70px; }
            .play-btn     { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<!-- ============================ SIDEBAR ============================ -->
<aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
            </svg>
        </div>
        <div>
            <div class="brand-name">Kurdistan Live</div>
            <div class="brand-tag">Media Hub</div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab-pill"></div>
        <button class="tab-btn active" id="tvTab" onclick="switchMode('tv')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
            </svg>TV
        </button>
        <button class="tab-btn" id="radioTab" onclick="switchMode('radio')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 17a24.12 24.12 0 0 1 0-10"/><path d="M5.5 13.7a10 10 0 0 1 0-3.4"/><circle cx="12" cy="12" r="2"/><path d="M18.5 13.7a10 10 0 0 0 0-3.4"/><path d="M21.5 17a24.12 24.12 0 0 0 0-10"/>
            </svg>Radio
        </button>
    </div>

    <!-- Filled in by JavaScript from TV_CHANNELS / RADIO_STATIONS -->
    <ul class="list" id="tvList"></ul>
    <ul class="list" id="radioList" hidden></ul>
</aside>

<!-- ============================ MAIN ============================ -->
<main class="main">
    <div class="topbar">
        <div class="logo" id="topLogo"></div>
        <span class="topbar-name" id="topName">—</span>
        <div class="badge"><span class="dot"></span><span id="badgeText">Live</span></div>
    </div>

    <div class="stage">
        <!-- TV player: a <video> or <iframe> is inserted here by playTV() -->
        <div class="tv" id="tvPlayer">
            <div class="loader" id="loader">
                <div class="spinner"></div>
                Loading stream…
            </div>
        </div>

        <!-- Radio player -->
        <div class="radio" id="radioPlayer">
            <div class="orb-scene">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="orb"><div class="logo" id="orbLogo"></div></div>
            </div>
            <div>
                <div class="station-name"  id="stationName">Select a Station</div>
                <div class="station-genre" id="stationGenre">Kurdish Radio</div>
            </div>
            <div class="controls">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <input type="range" class="volume" id="volume" min="0" max="1" step="0.02" value="0.85">
                <button class="play-btn" id="playBtn" onclick="toggleRadio()"></button>
            </div>
        </div>
    </div>
</main>

<!-- One shared audio element plays every radio station -->
<audio id="audio" preload="none"></audio>

<script>
/* =================================================================
   1. CHANNELS & STATIONS
   To add a channel, copy a line and change it.
     type 'hls'    → url is an .m3u8 live stream (best quality, plays in our own player)
     type 'iframe' → url is a web page that is embedded as-is
     fallback      → (optional) web page to embed if the HLS stream fails
     logo          → image file next to this HTML file; if missing, initials are shown
   ================================================================= */
const TV_CHANNELS = [
    { name: 'Rudaw',     logo: 'image_0.png', type: 'hls',    url: 'https://live.rudaw.net/hls/rudaw-tv/master.m3u8',
      fallback: 'https://www.rudaw.net/en/livetv' },
    { name: 'Ronahi TV', logo: 'image_3.png', type: 'hls',    url: 'https://hlspackager.akamaized.net/live/DB/RONAHI_TV/HLS/RONAHI_TV.m3u8' },
    { name: 'Channel 8', logo: 'image_4.png', type: 'hls',    url: 'https://live.channel8.com/Channel8-Kurdish/index.fmp4.m3u8' },
    { name: 'Ava Media', logo: 'image_1.png', type: 'iframe', url: 'https://avamedia.live' },
    { name: 'Shams TV',  logo: 'image_2.png', type: 'hls',    url: 'https://stream.shams.tv/hls/0/stream.m3u8' },
    { name: 'Welat TV',  logo: 'image_5.png', type: 'hls',    url: 'https://stream.badinan.xyz/welat/tv/playlist.m3u8' },
    { name: 'Nuce TV',   logo: 'image_6.png', type: 'hls',    url: 'https://hlspackager.akamaized.net/live/DB/NU_TV/HLS/NU_TV.m3u8' },
];

// Radio stations are direct audio stream URLs. The first one plays when the Radio tab opens.
const RADIO_STATIONS = [
    { name: 'Arta FM',     genre: 'Music & Entertainment', logo: 'Artafm_7.png',    url: 'https://edge.mixlr.com/channel/qtgru' },
    { name: 'Kurd1 Radyo', genre: 'Kurdish Hits',          logo: 'Kurd1rayo_6.png', url: 'https://listen.radioking.com/radio/119251/stream/158701' },
];

// hls.js settings tuned for quick start-up of live streams
const HLS_CONFIG = {
    lowLatencyMode: true,
    liveSyncDurationCount: 1,      // start close to the live edge
    maxBufferLength: 10,           // seconds of video to buffer ahead
    startFragPrefetch: true,
    manifestLoadingMaxRetry: 4,
    fragLoadingMaxRetry: 5,
};

/* =================================================================
   2. STATE
   ================================================================= */
let hls = null;           // active hls.js instance (TV)
let currentTV = 0;        // index of selected TV channel
let currentRadio = -1;    // index of selected radio station (-1 = none yet)

const $ = id => document.getElementById(id);
const audio = $('audio');

/* =================================================================
   3. HELPERS
   ================================================================= */

// "Ronahi TV" → "RT"
function initials(name) {
    return name.split(' ').map(word => word[0]).join('');
}

// HTML for a logo: the image, which swaps itself for initials if the file can't load
function logoHtml(item) {
    const fallback = `<span class="initials">${initials(item.name)}</span>`;
    if (!item.logo) return fallback;
    return `<img src="${item.logo}" alt="${item.name}" onerror="this.outerHTML='${fallback.replace(/"/g, '&quot;')}'">`;
}

// Update the top bar with the current channel/station
function setTopBar(item) {
    $('topLogo').innerHTML = logoHtml(item);
    $('topName').textContent = item.name;
}

// Highlight the selected entry in a list
function markSelected(listId, index) {
    [...$(listId).children].forEach((li, i) => li.classList.toggle('selected', i === index));
}

/* =================================================================
   4. BUILD THE SIDEBAR LISTS
   ================================================================= */
function buildList(listId, items, subtitle, onClick) {
    items.forEach((item, i) => {
        const li = document.createElement('li');
        li.className = 'item';
        li.innerHTML = `
            <div class="logo">${logoHtml(item)}</div>
            <div style="overflow:hidden">
                <div class="item-name">${item.name}</div>
                <div class="item-sub">${subtitle(item)}</div>
            </div>`;
        li.onclick = () => onClick(i);
        $(listId).appendChild(li);
    });
}

/* =================================================================
   5. SWITCH BETWEEN TV AND RADIO
   ================================================================= */
function switchMode(mode) {
    const isRadio = mode === 'radio';

    document.body.classList.toggle('radio-mode', isRadio);
    $('tvTab').classList.toggle('active', !isRadio);
    $('radioTab').classList.toggle('active', isRadio);
    $('tvList').hidden = isRadio;
    $('radioList').hidden = !isRadio;
    $('badgeText').textContent = isRadio ? 'On Air' : 'Live';

    if (isRadio) {
        stopTV();
        playRadio(currentRadio < 0 ? 0 : currentRadio);   // Arta FM first time
    } else {
        audio.pause();
        playTV(currentTV);
    }
}

/* =================================================================
   6. TV
   ================================================================= */

// Remove whatever is playing and show the spinner
function stopTV() {
    if (hls) { hls.destroy(); hls = null; }
    $('tvPlayer').querySelectorAll('video, iframe').forEach(el => el.remove());
    showLoader(true);
}

function showLoader(visible) {
    $('loader').classList.toggle('hidden', !visible);
}

// Embed a web page in the player
function showIframe(url) {
    const frame = document.createElement('iframe');
    frame.src = url;
    frame.allow = 'autoplay; fullscreen';
    frame.allowFullscreen = true;
    frame.onload = () => showLoader(false);
    $('tvPlayer').appendChild(frame);
}

function playTV(index) {
    const channel = TV_CHANNELS[index];
    currentTV = index;
    markSelected('tvList', index);
    setTopBar(channel);
    stopTV();

    if (channel.type === 'iframe') {
        showIframe(channel.url);
        return;
    }

    // HLS stream → our own <video> player
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    $('tvPlayer').appendChild(video);

    if (window.Hls && Hls.isSupported()) {
        // Chrome, Firefox, Edge, Android
        hls = new Hls(HLS_CONFIG);
        hls.loadSource(channel.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            showLoader(false);
            video.play().catch(() => {});   // autoplay may be blocked; user can press play
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (!data.fatal) return;                         // hls.js handles minor errors itself
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();                     // decoding hiccup → try to recover
            } else {
                handleStreamFailure(channel, index);
            }
        });
    } else {
        // Safari / iPhone play HLS natively
        video.src = channel.url;
        video.addEventListener('loadedmetadata', () => showLoader(false));
        video.addEventListener('error', () => handleStreamFailure(channel, index));
    }
}

// Stream failed: use the fallback page if there is one, otherwise retry in 3 seconds
function handleStreamFailure(channel, index) {
    stopTV();
    if (channel.fallback) {
        showIframe(channel.fallback);
    } else {
        setTimeout(() => {
            const stillWatching = currentTV === index && !document.body.classList.contains('radio-mode');
            if (stillWatching) playTV(index);
        }, 3000);
    }
}

/* =================================================================
   7. RADIO
   ================================================================= */
const PLAY_ICON  = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

function playRadio(index) {
    const station = RADIO_STATIONS[index];
    currentRadio = index;
    markSelected('radioList', index);
    setTopBar(station);

    $('stationName').textContent = station.name;
    $('stationGenre').textContent = station.genre;
    $('orbLogo').innerHTML = logoHtml(station);

    audio.src = station.url;
    audio.play().catch(() => {});   // if autoplay is blocked, the user presses play
}

function toggleRadio() {
    if (currentRadio < 0) return;
    audio.paused ? audio.play() : audio.pause();
}

// Keep the button and animation in sync with the actual audio state
function setRadioPlaying(isPlaying) {
    $('radioPlayer').classList.toggle('playing', isPlaying);
    $('playBtn').innerHTML = isPlaying ? PAUSE_ICON : PLAY_ICON;
}
audio.addEventListener('playing', () => setRadioPlaying(true));
audio.addEventListener('pause',   () => setRadioPlaying(false));
audio.addEventListener('error',   () => setRadioPlaying(false));

// Volume slider
audio.volume = $('volume').value;
$('volume').oninput = e => audio.volume = e.target.value;

/* =================================================================
   8. START
   ================================================================= */
buildList('tvList', TV_CHANNELS,
    () => '<span class="dot"></span><span class="item-live">LIVE</span>',
    playTV);

buildList('radioList', RADIO_STATIONS,
    station => station.genre,
    playRadio);

setRadioPlaying(false);
playTV(0);   // start with the first TV channel
</script>
</body>
